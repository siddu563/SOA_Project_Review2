server:
  port: 8081
spring:
  application:
    name: AUTH-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/knowhub_auth
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    discovery:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
learnknow:
  jwt:
    secret: ${JWT_SECRET:change-this-learnknow-secret-key-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
