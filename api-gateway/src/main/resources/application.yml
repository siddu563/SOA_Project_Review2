server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/api/auth/** ]
        - id: courses
          uri: lb://COURSE-SERVICE
          predicates: [ Path=/api/courses/** ]
        - id: access
          uri: lb://ACCESS-SERVICE
          predicates: [ Path=/api/access/** ]
        - id: assignments
          uri: lb://ASSIGNMENT-SERVICE
          predicates: [ Path=/api/assignments/** ]
        - id: usage
          uri: lb://USAGE-SERVICE
          predicates: [ Path=/api/usage/** ]
        - id: ai
          uri: lb://AI-SERVICE
          predicates: [ Path=/api/ai/** ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
learnknow:
  jwt:
    secret: ${JWT_SECRET:change-this-learnknow-secret-key-32chars}
management:
  endpoints.web.exposure.include: health,info,gateway
