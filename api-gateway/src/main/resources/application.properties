server.port=8080
spring.application.name=API-GATEWAY
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=courses
spring.cloud.gateway.routes[1].uri=lb://COURSE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/courses/**
spring.cloud.gateway.routes[2].id=access
spring.cloud.gateway.routes[2].uri=lb://ACCESS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/access/**
spring.cloud.gateway.routes[3].id=assignments
spring.cloud.gateway.routes[3].uri=lb://ASSIGNMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/assignments/**
spring.cloud.gateway.routes[4].id=usage
spring.cloud.gateway.routes[4].uri=lb://USAGE-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/usage/**
spring.cloud.gateway.routes[5].id=ai
spring.cloud.gateway.routes[5].uri=lb://AI-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ai/**
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
learnknow.jwt.secret=${JWT_SECRET:change-this-learnknow-secret-key-32chars}
management.endpoints.web.exposure.include=health,info,gateway
